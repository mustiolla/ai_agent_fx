<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <style>
      .group-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #64748b; }
      .card-box { rx: 8px; ry: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); transition: all 0.2s; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #64748b; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ==================== 그룹 1: 1 & 2. 데이터 분석 & 동기화 ==================== -->
  <g transform="translate(20, 15)">
    <rect x="0" y="0" width="720" height="115" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" />
    <text x="360" y="24" class="group-title" fill="#92400e">1 &amp; 2. 데이터 분석 &amp; 실시간 동기화</text>
    
    <!-- 기능 1 카드 -->
    <g transform="translate(25, 36)">
      <rect x="0" y="0" width="320" height="64" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2" filter="url(#shadow)" />
      <text x="18" y="27" class="card-title">📊 1. 전일비 등락 뱃지</text>
      <text x="18" y="47" class="card-sub">어제 종가 대비 등락폭(원) 및 변동률(%) 모멘텀 표기</text>
    </g>

    <!-- 기능 2 카드 -->
    <g transform="translate(375, 36)">
      <rect x="0" y="0" width="320" height="64" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2" filter="url(#shadow)" />
      <text x="18" y="27" class="card-title">🔄 2. 실시간 환율 동기화</text>
      <text x="18" y="47" class="card-sub">Yahoo Finance 원클릭 수집 및 Firestore 무결성 적재</text>
    </g>
  </g>

  <!-- 연결 화살표 1 -->
  <path d="M 380 134 L 380 156" class="arrow" />
  <polygon points="380,162 375,154 385,154" class="arrow-head" />

  <!-- ==================== 그룹 2: 3 & 4. AI 금융 지능 & 계산 ==================== -->
  <g transform="translate(20, 168)">
    <rect x="0" y="0" width="720" height="115" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="360" y="24" class="group-title" fill="#0369a1">3 &amp; 4. AI 금융 지능 &amp; 스마트 계산</text>
    
    <!-- 기능 3 카드 -->
    <g transform="translate(25, 36)">
      <rect x="0" y="0" width="320" height="64" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2" filter="url(#shadow)" />
      <text x="18" y="27" class="card-title">💡 3. AI 데일리 브리핑</text>
      <text x="18" y="47" class="card-sub">Claude 기반 외환 시장 동향 진단 및 실전 환전·투자 팁</text>
    </g>

    <!-- 기능 4 카드 -->
    <g transform="translate(375, 36)">
      <rect x="0" y="0" width="320" height="64" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2" filter="url(#shadow)" />
      <text x="18" y="27" class="card-title">🧮 4. 스마트 환전 시뮬레이터</text>
      <text x="18" y="47" class="card-sub">우대율 반영 양방향 계산 &amp; AI 자율 툴 호출(Tool Use)</text>
    </g>
  </g>

  <!-- 연결 화살표 2 -->
  <path d="M 380 287 L 380 309" class="arrow" />
  <polygon points="380,315 375,307 385,307" class="arrow-head" />

  <!-- ==================== 그룹 3: 5 & 6. 사용자 경험 & 데이터 활용 ==================== -->
  <g transform="translate(20, 321)">
    <rect x="0" y="0" width="720" height="115" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
    <text x="360" y="24" class="group-title" fill="#6b21a8">5 &amp; 6. 사용자 경험 &amp; 데이터 활용</text>
    
    <!-- 기능 5 카드 -->
    <g transform="translate(25, 36)">
      <rect x="0" y="0" width="320" height="64" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2" filter="url(#shadow)" />
      <text x="18" y="27" class="card-title">🗂️ 5. 대화 기록 사이드바</text>
      <text x="18" y="47" class="card-sub">과거 금융 상담 세션 복원 및 내역 관리 드로어 인터페이스</text>
    </g>

    <!-- 기능 6 카드 -->
    <g transform="translate(375, 36)">
      <rect x="0" y="0" width="320" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)" />
      <text x="18" y="27" class="card-title">📥 6. 엑셀 CSV 다운로드</text>
      <text x="18" y="47" class="card-sub">UTF-8 BOM 무결성 엑셀 파일 저장 및 REST JSON 내보내기</text>
    </g>
  </g>
</svg>
